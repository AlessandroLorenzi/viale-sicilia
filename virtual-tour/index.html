<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Virtual tour — Viale Sicilia 4</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', sans-serif;
    }

    #tour {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .scene-links {
        position: fixed;
        left: 50%;
        bottom: 1.5em;
        transform: translateX(-50%);
        display: flex;
        gap: 0.8em;
        z-index: 10;
    }

    .scene-links a {
        padding: 0.5em 1.2em;
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        background: rgba(20, 18, 16, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 0.9em;
        font-weight: 600;
        backdrop-filter: blur(4px);
        transition: background 0.15s;
    }

    .scene-links a:hover {
        background: rgba(193, 101, 59, 0.85);
    }

    #debug-box {
        position: fixed;
        right: 1em;
        bottom: 1em;
        z-index: 10;
        padding: 0.6em 0.9em;
        border-radius: 8px;
        color: #fff;
        background: rgba(20, 18, 16, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-family: monospace;
        font-size: 0.85em;
        line-height: 1.5;
        backdrop-filter: blur(4px);
        white-space: pre;
    }

    #debug-crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        width: 32px;
        height: 32px;
        pointer-events: none;
    }

    #debug-crosshair::before,
    #debug-crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 60, 60, 0.85);
    }

    #debug-crosshair::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        transform: translateX(-50%);
    }

    #debug-crosshair::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        transform: translateY(-50%);
    }
</style>
</head>
<body>
    <div id="tour"></div>

    <div class="scene-links">
        <a href="#" onclick="tourViewer.loadScene('sala'); return false;">Sala</a>
        <a href="#" onclick="tourViewer.loadScene('ingresso'); return false;">Ingresso</a>
        <a href="#" onclick="tourViewer.loadScene('corridoio'); return false;">Corridoio</a>
        <a href="#" onclick="tourViewer.loadScene('camera-letto'); return false;">Camera da letto</a>
        <a href="#" onclick="tourViewer.loadScene('balcone-camera-letto'); return false;">Balcone camera da letto</a>
        <a href="#" onclick="tourViewer.loadScene('studio'); return false;">Studio</a>
        <a href="#" onclick="tourViewer.loadScene('bagno'); return false;">Bagno</a>
    </div>

    <div id="debug-box" style="display: none;"></div>
    <div id="debug-crosshair" style="display: none;"></div>

    <script>
        var tourViewer = pannellum.viewer('tour', {
            default: {
                firstScene: 'sala',
                autoLoad: true,
                sceneFadeDuration: 800
            },
            scenes: {
                ingresso: {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/SALA/PANORAMA/CAM_20260808130901_0294_D.JPG',
                    yaw: -50,
                    hotSpots: [
                        {
                            pitch: -8,
                            yaw: -90,
                            type: 'scene',
                            sceneId: 'sala',
                            text: 'Sala'
                        },
                        {
                            pitch: -3.4144222449052872,
                            yaw: 104.06011050517816,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio'
                        }
                    ]
                },
                corridoio: {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/CORRIDOIO/PANORAMA/compose_video_1787133627568.JPG',
                    yaw: -92.19024481073029,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 79.28990122489097,
                            type: 'scene',
                            sceneId: 'ingresso',
                            text: 'Ingresso'
                        },
                        {
                            pitch: 0,
                            yaw: -82,
                            type: 'scene',
                            sceneId: 'camera-letto',
                            text: 'Camera da letto'
                        },
                        {
                            pitch: 0,
                            yaw: -60,
                            type: 'scene',
                            sceneId: 'studio',
                            text: 'Studio'
                        },
                        {
                            pitch: 0,
                            yaw: -89.15612988531626,
                            type: 'scene',
                            sceneId: 'bagno',
                            text: 'Bagno'
                        }
                    ]
                },
                bagno: {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/BAGNO/PANORAMA/compose_video_1787931419127.JPG',
                    yaw: -95.59702182240011,
                    pitch: -8.200613528474388,
                    hfov: 120,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 80.86911247427702,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio'
                        }
                    ]
                },
                studio: {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/STUDIO/PANORAMA/compose_video_1787398914704.JPG',
                    yaw: -132.6956381213763,
                    pitch: -18.044250454862812,
                    hfov: 120,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 87,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio'
                        }
                    ]
                },
                sala: {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/SALA/PANORAMA/CAM_20260808130928_0295_D.JPG',
                    yaw: 165.16358969916212,
                    hotSpots: [
                        {
                            pitch: -10,
                            yaw: 105,
                            type: 'scene',
                            sceneId: 'ingresso',
                            text: 'Ingresso'
                        }
                    ]
                },
                'balcone-camera-letto': {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/CAMERA_DA_LETTO/PANORAMA/compose_video_1787128965712.JPG',
                    yaw: -75.75296535392698,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: -128.02824820580452,
                            type: 'scene',
                            sceneId: 'camera-letto',
                            text: 'Camera da letto'
                        }
                    ]
                },
                'camera-letto': {
                    type: 'equirectangular',
                    panorama: '../FOTO/ROOMS/CAMERA_DA_LETTO/PANORAMA/compose_video_1787130177340.jpg',
                    yaw: -99.68385438129792,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: -111.71172598623036,
                            type: 'scene',
                            sceneId: 'balcone-camera-letto',
                            text: 'Balcone'
                        },
                        {
                            pitch: 0,
                            yaw: 104.45041858199568,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio'
                        }
                    ]
                }
            }
        });

        if (window.location.hash === '#debug') {
            var debugBox = document.getElementById('debug-box');
            debugBox.style.display = 'block';
            document.getElementById('debug-crosshair').style.display = 'block';
            setInterval(function () {
                debugBox.textContent =
                    'yaw: ' + tourViewer.getYaw() +
                    '\npitch: ' + tourViewer.getPitch() +
                    '\nhfov: ' + tourViewer.getHfov();
            }, 200);
        }
    </script>
</body>

</html>
