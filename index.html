<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foto Casa</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="Trilocale in Viale Sicilia 4, Busto Arsizio" />
<meta property="og:description" content="Foto e virtual tour del trilocale in Viale Sicilia 4, Busto Arsizio." />
<meta property="og:image" content="https://alessandrolorenzi.github.io/viale-sicilia/opengraph.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://alessandrolorenzi.github.io/viale-sicilia/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
    :root {
        --cream: #faf6f1;
        --card: #ffffff;
        --charcoal: #2b2a28;
        --terracotta: #c1653b;
        --terracotta-dark: #a5502c;
        --muted: #8a8378;
        --border: #ece5db;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--cream);
        color: var(--charcoal);
        font-family: 'Inter', sans-serif;
    }

    .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 3em 1.5em 5em;
    }

    header.hero {
        text-align: center;
        margin-bottom: 3em;
    }

    header.hero .tag {
        display: inline-block;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-size: 0.75em;
        color: var(--terracotta);
        font-weight: 600;
        margin-bottom: 0.75em;
    }

    header.hero h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2.6em;
        margin: 0;
        color: var(--charcoal);
    }

    section {
        margin-bottom: 3.5em;
    }

    section h2 {
        font-family: 'Playfair Display', serif;
        font-size: 1.6em;
        margin: 0 0 0.2em;
        color: var(--charcoal);
    }

    section h3 {
        font-size: 0.95em;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 1.2em;
    }

    .divider {
        width: 48px;
        height: 3px;
        background: var(--terracotta);
        border: none;
        border-radius: 2px;
        margin: 0.9em 0 1.6em;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 260px));
        gap: 1.2em;
    }

    .gallery .thumb-card {
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        aspect-ratio: 4 / 3;
        box-shadow: 0 4px 14px rgba(43, 42, 40, 0.1);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gallery .thumb-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 24px rgba(43, 42, 40, 0.18);
    }

    .gallery .thumb-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .pano-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.4em;
    }

    .pano-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 0.6em;
        box-shadow: 0 4px 14px rgba(43, 42, 40, 0.08);
    }

    .scene-links {
        display: flex;
        gap: 0.8em;
        margin-top: 0.8em;
    }

    .scene-links a {
        padding: 0.5em 1.2em;
        border: 1px solid var(--border);
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        background: var(--terracotta);
        font-size: 0.9em;
        font-weight: 600;
        transition: background 0.15s;
    }

    .scene-links a:hover {
        background: var(--terracotta-dark);
    }

    .pano {
        width: 100%;
        height: 380px;
        border-radius: 12px;
        overflow: hidden;
    }

    .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 18, 16, 0.92);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .lightbox.open {
        display: flex;
    }

    .lightbox img {
        max-width: 88%;
        max-height: 88%;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .lightbox .close,
    .lightbox .prev,
    .lightbox .next {
        position: absolute;
        color: #f5efe8;
        font-size: 2.2em;
        cursor: pointer;
        user-select: none;
        background: rgba(255, 255, 255, 0.08);
        border: none;
        border-radius: 50%;
        width: 1.8em;
        height: 1.8em;
        line-height: 1.8em;
        text-align: center;
        transition: background 0.2s ease;
    }

    .lightbox .close:hover,
    .lightbox .prev:hover,
    .lightbox .next:hover {
        background: rgba(255, 255, 255, 0.18);
    }

    .lightbox .close {
        top: 1em;
        right: 1em;
        font-size: 1.6em;
    }

    .lightbox .prev {
        left: 1em;
        top: 50%;
        transform: translateY(-50%);
    }

    .lightbox .next {
        right: 1em;
        top: 50%;
        transform: translateY(-50%);
    }
</style>
</head>
<body>
    <div class="page">
        <header class="hero">
            <span class="tag">Trilocale in Viale Sicilia 4, Busto Arsizio</span>
            <h1>Foto</h1>
        </header>

        <section>
            <h2>Sala</h2>
            <hr class="divider" />
            <div class="gallery">
                <div class="thumb-card" onclick="openLightbox(0)"><img src="SALA/CAM_20260808143547_0301_D.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(1)"><img src="SALA/CAM_20260808143626_0302_D.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(2)"><img src="SALA/CAM_20260808143700_0303_D.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(3)"><img src="SALA/CAM_20260808143755_0304_D.JPG" /></div>
            </div>
        </section>

        <section>
            <h2>Corridoio</h2>
            <hr class="divider" />
            <div class="gallery">
                <div class="thumb-card" onclick="openLightbox(4)"><img src="CORRIDOIO/compose_video_1787133616953.JPG" /></div>
            </div>
        </section>

        <section>
            <h2>Camera da letto</h2>
            <hr class="divider" />
            <div class="gallery">
                <div class="thumb-card" onclick="openLightbox(5)"><img src="CAMERA_DA_LETTO/compose_video_1787129033671.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(6)"><img src="CAMERA_DA_LETTO/compose_video_1787129014474.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(7)"><img src="CAMERA_DA_LETTO/compose_video_1787128954237.JPG" /></div>
                <div class="thumb-card" onclick="openLightbox(8)"><img src="CAMERA_DA_LETTO/compose_video_1787129244158.JPG" /></div>
            </div>
        </section>

        <section>
            <header class="hero">
                <h1>Virtual tour</h1>
            </header>
            <div class="pano-card">
                <div id="tour" class="pano" style="height: 520px;"></div>
            </div>
            <div class="scene-links">
                <a href="#" onclick="tourViewer.loadScene('sala'); return false;">Sala</a>
                <a href="#" onclick="tourViewer.loadScene('ingresso'); return false;">Ingresso</a>
                <a href="#" onclick="tourViewer.loadScene('corridoio'); return false;">Corridoio</a>
                <a href="#" onclick="tourViewer.loadScene('camera-letto'); return false;">Camera da letto</a>
                <a href="#" onclick="tourViewer.loadScene('balcone-camera-letto'); return false;">Balcone camera da letto</a>
            </div>
            <div class="scene-links">
                <a href="virtual-tour/">Apri a schermo intero</a>
            </div>
        </section>
    </div>

    <div id="lightbox" class="lightbox">
        <button class="close" onclick="closeLightbox()">&times;</button>
        <button class="prev" onclick="showDelta(-1)">&#8249;</button>
        <img id="lightbox-img" src="" />
        <button class="next" onclick="showDelta(1)">&#8250;</button>
    </div>

    <script>
        var photos = [
            'SALA/CAM_20260808143547_0301_D.JPG',
            'SALA/CAM_20260808143626_0302_D.JPG',
            'SALA/CAM_20260808143700_0303_D.JPG',
            'SALA/CAM_20260808143755_0304_D.JPG',
            'CORRIDOIO/compose_video_1787133616953.JPG',
            'CAMERA_DA_LETTO/compose_video_1787129033671.JPG',
            'CAMERA_DA_LETTO/compose_video_1787129014474.JPG',
            'CAMERA_DA_LETTO/compose_video_1787128954237.JPG',
            'CAMERA_DA_LETTO/compose_video_1787129244158.JPG'
        ];
        var currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById('lightbox-img').src = photos[currentIndex];
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        function showDelta(delta) {
            currentIndex = (currentIndex + delta + photos.length) % photos.length;
            document.getElementById('lightbox-img').src = photos[currentIndex];
        }

        document.getElementById('lightbox').addEventListener('click', function (e) {
            if (e.target === this) closeLightbox();
        });

        document.addEventListener('keydown', function (e) {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showDelta(-1);
            if (e.key === 'ArrowRight') showDelta(1);
        });

        var tourViewer = pannellum.viewer('tour', {
            default: {
                firstScene: 'sala',
                autoLoad: true,
                sceneFadeDuration: 800
            },
            scenes: {
                ingresso: {
                    type: 'equirectangular',
                    panorama: 'SALA/PANORAMA/CAM_20260808130901_0294_D.JPG',
                    yaw: -50,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: -90,
                            type: 'scene',
                            sceneId: 'sala',
                            text: 'Sala',
                            pitch: -8,
                        },
                        {
                            pitch: -3.4144222449052872,
                            yaw: 104.06011050517816,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio',
                        }
                    ]
                },
                corridoio: {
                    type: 'equirectangular',
                    panorama: 'CORRIDOIO/PANORAMA/compose_video_1787133627568.JPG',
                    yaw: -92.19024481073029,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 79.28990122489097,
                            type: 'scene',
                            sceneId: 'ingresso',
                            text: 'Ingresso',
                        },
                        {
                            pitch: 0,
                            yaw: -82,
                            type: 'scene',
                            sceneId: 'camera-letto',
                            text: 'Camera da letto',
                        }
                    ]
                },
                sala: {
                    type: 'equirectangular',
                    panorama: 'SALA/PANORAMA/CAM_20260808130928_0295_D.JPG',
                    yaw: 165.16358969916212,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 105,
                            type: 'scene',
                            sceneId: 'ingresso',
                            text: 'Ingresso',
                            pitch: -10,
                        }
                    ]
                },
                'balcone-camera-letto': {
                    type: 'equirectangular',
                    panorama: 'CAMERA_DA_LETTO/PANORAMA/compose_video_1787128965712.JPG',
                    yaw: -75.75296535392698,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: -128.02824820580452,
                            type: 'scene',
                            sceneId: 'camera-letto',
                            text: 'Camera da letto',
                        }
                    ]
                },
                'camera-letto': {
                    type: 'equirectangular',
                    panorama: 'CAMERA_DA_LETTO/PANORAMA/compose_video_1787130177340.jpg',
                    yaw: -99.68385438129792,
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: -111.71172598623036,
                            type: 'scene',
                            sceneId: 'balcone-camera-letto',
                            text: 'Balcone',
                        },
                        {
                            pitch: 0,
                            yaw: 104.45041858199568,
                            type: 'scene',
                            sceneId: 'corridoio',
                            text: 'Corridoio',
                        }
                    ]
                }
            }
        });
    </script>
</body>

</html>
